          format: int64
        forge_id:
          type: integer
          format: int64
        installation_id:
          type: integer
          format: int64
        owner:
          type: string
        name:
          type: string
        default_branch:
          type: string
        watched:
          type: boolean
        refreshed_at:
          type: string
          format: date-time
