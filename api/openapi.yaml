            $ref: "#/components/schemas/Repo"
    RepoRequest:
      type: object
      required: [installation_id, owner, name]
      properties:
        installation_id:
          type: integer
          format: int64
        owner:
          type: string
        name:
          type: string
    RepoPatch:
      type: object
