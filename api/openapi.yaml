        created_at:
          type: string
          format: date-time
    Forges:
      type: object
      required: [forges]
      properties:
        forges:
          type: array
          items:
            $ref: "#/components/schemas/Forge"
    ForgeRequest:
      type: object
      required: [kind, name, base_address]
      properties:
        kind:
          type: string
          enum: [github]
        name:
          type: string
        base_address:
          type: string
    ForgePatch:
      type: object
      properties:
        name:
          type: string
        base_address:
          type: string
    Provider:
      type: object
      required: [id, kind, name, forge_id, client_id, created_at]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [forge]
        name:
          type: string
        forge_id:
          type: integer
          format: int64
        client_id:
          type: string
        created_at:
          type: string
          format: date-time
    Providers:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/Provider"
    ProviderRequest:
      type: object
      required: [id, kind, name, forge_id, client_id, client_secret]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [forge]
        name:
          type: string
        forge_id:
          type: integer
          format: int64
        client_id:
          type: string
        client_secret:
          type: string
    ProviderPatch:
      type: object
      properties:
        name:
          type: string
        client_id:
          type: string
        client_secret:
          type: string
    RepoRef:
      type: object
      required: [id, owner, name]
