      required: [app_id, installation_id, private_key]
      properties:
        app_id:
          type: integer
          format: int64
        installation_id:
          type: integer
          format: int64
        private_key:
          type: string
          description: PEM.
    InstallationRequest:
      type: object
      required: [forge_id, name, kind]
      properties:
        forge_id:
          type: integer
          format: int64
        name:
          type: string
        kind:
          type: string
          enum: [token, app]
        token:
          type: string
          description: For kind token.
        app:
          $ref: "#/components/schemas/AppCredential"
        webhook_secret:
          type: string
    InstallationPatch:
      type: object
      properties:
        name:
          type: string
        token:
          type: string
        app:
          $ref: "#/components/schemas/AppCredential"
        webhook_secret:
          type: string
          description: Empty to stop taking deliveries.
    Account:
      type: object
      required: [id, login, name]
      properties:
        id:
          type: integer
          format: int64
        login:
          type: string
        name:
          type: string
    PullRequestSummary:
      type: object
      required: [id, repo, number, title, state, author, head_branch, base_branch, checks, stale, refreshed_at, url]
      properties:
        id:
          type: integer
          format: int64
        repo:
          $ref: "#/components/schemas/RepoRef"
        number:
          type: integer
        title:
          type: string
        state:
          type: string
          enum: [open, draft, merged, closed]
        author:
          $ref: "#/components/schemas/Account"
        head_branch:
          type: string
        base_branch:
          type: string
        checks:
          type: string
          enum: [none, passing, pending, failing]
          description: The required checks, taken together.
        stale:
          type: boolean
          description: The last refresh from the forge failed; these facts are as of refreshed_at.
        refreshed_at:
          type: string
          format: date-time
        url:
          type: string
          description: The pull request on its forge, built for this response.
    PullRequests:
      type: object
      required: [pull_requests]
      properties:
        pull_requests:
          type: array
          items:
            $ref: "#/components/schemas/PullRequestSummary"
    PullRequest:
      type: object
      required: [summary, facts, accounts]
      properties:
        summary:
          $ref: "#/components/schemas/PullRequestSummary"
        facts:
          $ref: "#/components/schemas/PullRequestFacts"
        accounts:
          type: array
          description: The accounts the facts name, for display.
          items:
            $ref: "#/components/schemas/Account"
    PullRequestFacts:
      type: object
      required: [number, title, state, author, labels, created_at, updated_at, head_repo, head_branch, head_sha, head_pushed_at,
        base_branch, mergeable, can_merge_now, merge_blockers, required_approvals, code_owner_review_required,
        author_can_dismiss, review_requests, reviews, threads, conversation, checks, missing_required_checks, references,
        closes_issues]
      properties:
        number:
          type: integer
        title:
          type: string
        state:
          type: string
          enum: [open, draft, merged, closed]
        author:
          type: integer
          format: int64
        labels:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        ready_at:
          type: string
          format: date-time
          nullable: true
        merged_at:
          type: string
          format: date-time
          nullable: true
        closed_at:
          type: string
          format: date-time
          nullable: true
        head_repo:
          type: integer
          format: int64
          description: The forge's ID of the head's repository; another repository's for a fork.
        head_branch:
          type: string
        head_sha:
          type: string
        head_pushed_at:
          type: string
          format: date-time
        base_branch:
          type: string
        mergeable:
          type: string
          enum: [clean, conflicting, unknown]
        can_merge_now:
          type: boolean
        merge_blockers:
          type: array
          items:
            type: string
            enum: [reviews, code_owners, checks, behind, conflicts, other]
        required_approvals:
          type: integer
        code_owner_review_required:
          type: boolean
        author_can_dismiss:
          type: boolean
        review_requests:
          type: array
          items:
            $ref: "#/components/schemas/ReviewRequest"
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/ReviewFact"
        threads:
          type: array
          items:
            $ref: "#/components/schemas/ThreadFact"
        conversation:
          type: array
          items:
            $ref: "#/components/schemas/CommentFact"
        checks:
          type: array
          items:
            $ref: "#/components/schemas/CheckFact"
        missing_required_checks:
          type: array
          description: Required checks that have not reported on the head commit; they count as pending.
          items:
            type: string
        references:
          type: array
          items:
            $ref: "#/components/schemas/PullRef"
        closes_issues:
          type: array
          items:
            $ref: "#/components/schemas/PullRef"
    ReviewRequest:
      type: object
      required: [code_owner]
      properties:
        account:
          type: integer
          format: int64
        team:
          type: integer
          format: int64
        requested_at:
          type: string
          format: date-time
          nullable: true
        code_owner:
          type: boolean
    ReviewFact:
      type: object
      required: [id, author, state, commit, at, has_body, counts]
      properties:
        id:
          type: integer
          format: int64
        author:
          type: integer
          format: int64
        state:
          type: string
          enum: [approved, changes_requested, commented, dismissed]
        commit:
          type: string
        at:
          type: string
          format: date-time
        has_body:
          type: boolean
        counts:
          type: boolean
          description: Whether the author's approval counts toward the forge's requirement.
    ThreadFact:
      type: object
      required: [id, resolved, outdated, comments]
      properties:
        id:
          type: string
        resolved:
          type: boolean
        outdated:
          type: boolean
        comments:
          type: array
          items:
            $ref: "#/components/schemas/CommentFact"
    CommentFact:
      type: object
      required: [id, author, at]
      properties:
        id:
          type: integer
          format: int64
        author:
          type: integer
          format: int64
        at:
          type: string
          format: date-time
        edited_at:
          type: string
          format: date-time
          nullable: true
    CheckFact:
      type: object
      required: [name, state, required]
      properties:
        name:
          type: string
        state:
          type: string
          enum: [passing, pending, failing]
        required:
          type: boolean
        since:
          type: string
          format: date-time
          nullable: true
    PullRef:
      type: object
      required: [repo, number]
      properties:
        repo:
          type: integer
          format: int64
        number:
          type: integer
    Timeline:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/FactEvent"
    FactEvent:
      type: object
      required: [seq, observed_at, source, changes]
      properties:
        seq:
          type: integer
          format: int64
        observed_at:
          type: string
          format: date-time
        source:
          type: string
        changes:
          type: object
          description: Each changed field, with its value before and after.
          additionalProperties:
            $ref: "#/components/schemas/FieldChange"
    FieldChange:
      type: object
      required: [old, new]
      properties:
        old: {}
        new: {}
    ChainPosition:
      type: object
      required: [position, length, below]
      properties:
        id:
          type: integer
          format: int64
          description: The chain, named by its lowest pull request ID; absent when not stacked.
        position:
          type: integer
        length:
          type: integer
        below:
          type: integer
          description: Open pull requests it stacks on, directly or not.
    GroupMember:
      type: object
      required: [pull_request, open, since, source, reason, chain]
      properties:
        pull_request:
          type: integer
          format: int64
        open:
          type: boolean
        since:
          type: string
          format: date-time
        source:
          type: string
          enum: [manual, external, structural]
        reason:
          type: string
        chain:
          $ref: "#/components/schemas/ChainPosition"
    Group:
      type: object
      required: [id, name, name_source, state, created_at, members]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        name_source:
          type: string
          enum: [manual, external, issue, branch, refs]
        state:
          type: string
          enum: [active, archived]
        created_at:
          type: string
          format: date-time
        members:
          type: array
          items:
            $ref: "#/components/schemas/GroupMember"
    Groups:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/Group"
    GroupRequest:
      type: object
      required: [name, pull_requests]
      properties:
        name:
          type: string
        pull_requests:
          type: array
          items:
            type: integer
            format: int64
    GroupPatch:
      type: object
      required: [name]
      properties:
        name:
          type: string
    MemberRequest:
      type: object
      required: [pull_request]
      properties:
        pull_request:
          type: integer
          format: int64
    MergeRequest:
      type: object
      required: [from]
      properties:
        from:
          type: integer
          format: int64
          description: The group absorbed.
    Suggestion:
      type: object
      required: [id, pull_request, group, reason, created_at]
      properties:
        id:
          type: integer
          format: int64
        pull_request:
          type: integer
          format: int64
        group:
          type: integer
          format: int64
        reason:
          type: string
        created_at:
          type: string
          format: date-time
    Suggestions:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          items:
            $ref: "#/components/schemas/Suggestion"
    PRName:
      type: object
      required: [repo, number]
      properties:
        repo:
          type: string
          description: owner/name, or a name only one watched repository has.
        number:
          type: integer
    AssertionRequest:
      type: object
      required: [anchor, pull_requests]
      properties:
        anchor:
          type: string
          description: An ID in the bridge's own system, never a link.
        title:
          type: string
        evidence:
          type: array
          description: IDs in the bridge's own system, never links.
          items:
            type: string
        pull_requests:
          type: array
          items:
            $ref: "#/components/schemas/PRName"
    AssertionResult:
      type: object
      required: [id, applied]
      properties:
        id:
          type: integer
          format: int64
        applied:
          type: boolean
    Bridge:
      type: object
      required: [id, name, owner_id, link_template, created_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        owner_id:
          type: integer
          format: int64
        link_template:
          type: string
          description: An address with {id} for an anchor or evidence ID, used to render links.
        created_at:
          type: string
          format: date-time
    Bridges:
      type: object
      required: [bridges]
      properties:
        bridges:
          type: array
          items:
            $ref: "#/components/schemas/Bridge"
    BridgeRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        owner_id:
          type: integer
          format: int64
          description: The member who owns it; the caller by default.
        link_template:
          type: string
    Field:
      type: object
      required: [name, type, meaning]
      properties:
        name:
          type: string
          description: Such as pr.checks.
        type:
          type: string
          enum: [boolean, number, optional number, choice, text, account, list of text, list of accounts,
            list of accounts and teams, list of choices, judgement]
          description: Numbers are whole numbers, and hours whole hours; accounts are logins.
        meaning:
          type: string
        choices:
          type: array
          items:
            type: string
          description: The values of a choice, a list of choices, or a judgement.
    Fields:
      type: object
      required: [fields]
      properties:
        fields:
          type: array
          items:
            $ref: "#/components/schemas/Field"
    Question:
      type: object
      required: [name, role, asks, answers]
      properties:
        name:
          type: string
          description: A condition reads its answer as judgement.<name>.
        role:
          type: string
          enum: [author, reviewer]
          description: The role it is asked for.
        asks:
          type: string
        answers:
          type: array
          items:
            type: string
    Questions:
      type: object
      required: [questions]
      properties:
        questions:
          type: array
          items:
            $ref: "#/components/schemas/Question"
    RuleSet:
      type: object
      required: [author, reviewer]
      description: Each role's ordered list of rules. The first rule whose condition matches decides a person's part.
      properties:
        author:
          type: array
          items:
            $ref: "#/components/schemas/Rule"
        reviewer:
          type: array
          items:
            $ref: "#/components/schemas/Rule"
    RuleSetDocument:
      type: object
      additionalProperties: true
      description: >-
        A rule set as RuleSet describes it, such as an imported rule-set file. It is read strictly: a key RuleSet does
        not have is refused, rather than dropped.
    Rule:
      type: object
      required: [name, when, then]
      properties:
        name:
          type: string
        passed_over:
          type: string
          description: Shown in a path when the rule does not match.
        when:
          $ref: "#/components/schemas/Condition"
        then:
          $ref: "#/components/schemas/Conclusion"
    Condition:
      type: object
      description: >-
        Exactly one of: always, the catch-all; all or any of conditions; expr, a CEL expression, only as a whole
        condition; or a term, a field and an op, with a value when the op takes one.
      properties:
        always:
          type: boolean
        all:
          type: array
          items:
            $ref: "#/components/schemas/Condition"
        any:
          type: array
          items:
            $ref: "#/components/schemas/Condition"
        expr:
          type: string
        field:
          type: string
        op:
          type: string
          description: >-
            is_true, is_false; eq, ne, lt, le, gt, ge; is, is_not, is_one_of; starts_with, contains; is_empty,
            is_not_empty; is_set, is_not_set.
        value:
          description: >-
            A whole number, a text, a list of texts for is_one_of, or {"field": name} for another number field.
    Conclusion:
      type: object
      required: [kind, reason]
      properties:
        kind:
          type: string
          description: act, hold, finish, or idle; a reviewer's part is act or idle.
        action:
          type: string
          description: Required for act; merge, or none, for finish.
        targets:
          type: string
          description: For request_review, a list-of-accounts field, such as pr.blocked_by.
        priority:
          type: string
          description: normal, the default, or low.
        reason:
          type: string
          description: Text, with expressions in braces; {{ and }} are literal braces.
        remind:
          type: boolean
          description: Only for idle.
        task:
          type: boolean
          description: The part may become a task; only for actions that can be tasks.
    Problem:
      type: object
      required: [part, code, message]
      properties:
        role:
          type: string
          enum: [author, reviewer]
        rule:
          type: integer
          description: The rule's number in its list, from 1; absent for a problem of a list or of the draft.
        part:
          type: string
          enum: [list, name, when, then, reason, base]
        code:
          type: string
        message:
          type: string
    RuleSetVersionSummary:
      type: object
      required: [version, published_at]
      properties:
        version:
          type: integer
        based_on:
          type: integer
          description: The version its draft started from; absent for the first.
        published_by:
          type: integer
          format: int64
          description: The member who published it; absent for the default rule set, published by Park.
        published_at:
          type: string
          format: date-time
    RuleSetVersions:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          items:
            $ref: "#/components/schemas/RuleSetVersionSummary"
    RuleSetVersion:
      type: object
      required: [version, published_at, rules]
      properties:
        version:
          type: integer
        based_on:
          type: integer
        published_by:
          type: integer
          format: int64
        published_at:
          type: string
          format: date-time
        rules:
          $ref: "#/components/schemas/RuleSet"
    RuleSetDraft:
      type: object
      required: [id, rules, problems, created_by, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        base_version:
          type: integer
          description: The version it started from; absent before the first.
        rules:
          $ref: "#/components/schemas/RuleSet"
        problems:
          type: array
          items:
            $ref: "#/components/schemas/Problem"
          description: What keeps it from being published now; empty when nothing does.
        created_by:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        published_version:
          type: integer
          description: The version it became, once published.
    DraftRequest:
      type: object
      properties:
        base_version:
          type: integer
          description: The version it starts from; the one published now by default.
        rules:
          $ref: "#/components/schemas/RuleSetDocument"
    DraftUpdate:
      type: object
      required: [rules]
      properties:
        rules:
          $ref: "#/components/schemas/RuleSetDocument"
        base_version:
          type: integer
          description: Moves the draft's base, to bring it up to date with the version published now.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: A stable code, such as `not_found`.
            message:
              type: string
              description: For people; never internal details.
  responses:
    Error:
      description: An error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
