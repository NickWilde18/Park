openapi: 3.0.3
info:
  title: Park
  version: v1
  description: >-
    Park's API: the one contract that the dashboard, executors, and bridges use. Server code and client types are
    generated from this document. Within v1, changes only add.


    A browser signs in and holds a session cookie; every request that changes state must then carry the session's
    CSRF token, from `GET /me`, in the `X-CSRF-Token` header. A program sends an API token as
    `Authorization: Bearer park_…`, and may do only what the token's scopes allow. Request bodies are JSON.
  license:
    name: MIT
servers:
  - url: /api/v1
security:
  - session: []
  - token: []
paths:
  /setup:
    get:
      operationId: getSetup
      summary: Whether Park still needs its first administrator
      tags: [session]
      security: []
      responses:
        "200":
          description: Whether setup is needed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: completeSetup
      summary: Create the first administrator
      description: >-
        Needs the one-time setup code that Park printed to its log, or took from its environment, when it started with
        no members. The new administrator is signed in.
      tags: [session]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: The first administrator, signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        default:
          $ref: "#/components/responses/Error"
  /auth/providers:
    get:
      operationId: listAuthProviders
      summary: The ways to sign in
      description: The sign-in providers an admin has configured, for the sign-in page.
      tags: [session]
      security: []
      responses:
        "200":
          description: The ways to sign in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProviders"
        default:
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      operationId: login
      summary: Sign in with a local account
      description: Failures are limited per username and per client address.
      tags: [session]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: The member, signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        default:
          $ref: "#/components/responses/Error"
  /auth/register:
    post:
      operationId: register
      summary: Join with an invite and a local account
      tags: [session]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: The new member, signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        default:
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      operationId: logout
      summary: Sign this browser out
      tags: [session]
      responses:
        "204":
          description: Signed out.
        default:
          $ref: "#/components/responses/Error"
  /auth/{provider}/start:
    get:
      operationId: startSignIn
      summary: Begin signing in, or connecting an account, through a forge
      description: >-
        Redirects the browser to the forge. With `mode=link`, the signed-in member connects the forge account they
        authorize. With an `invite`, a forge account new to Park joins.
      tags: [session]
      security: []
      parameters:
        - $ref: "#/components/parameters/ProviderID"
        - name: mode
          in: query
          schema:
            type: string
            enum: [signin, link]
            default: signin
        - name: invite
          in: query
          schema:
            type: string
      responses:
        "302":
          description: To the forge.
        default:
          $ref: "#/components/responses/Error"
  /auth/{provider}/callback:
    get:
      operationId: finishSignIn
      summary: Where the forge sends the browser back
      description: >-
        Redirects to `/` when signed in, to `/settings` when an account was connected, and otherwise to `/` with
        `sign_in_error` set to the error's code.
      tags: [session]
      security: []
      parameters:
        - $ref: "#/components/parameters/ProviderID"
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Back into Park.
        default:
          $ref: "#/components/responses/Error"
  /me:
    get:
      operationId: getMe
      summary: Who is calling
      tags: [me]
      responses:
        "200":
          description: The calling member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Error"
  /me/identities:
    get:
      operationId: listMyIdentities
      summary: My linked forge accounts
      tags: [me]
      responses:
        "200":
          description: The calling member's forge accounts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identities"
        default:
          $ref: "#/components/responses/Error"
  /me/identities/{id}:
    delete:
      operationId: deleteMyIdentity
      summary: Disconnect one of my forge accounts
      tags: [me]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Disconnected.
        default:
          $ref: "#/components/responses/Error"
  /me/tokens:
    get:
      operationId: listMyTokens
      summary: My API tokens
      tags: [me]
      responses:
        "200":
          description: The calling member's tokens, without their secrets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tokens"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createMyToken
      summary: Create an API token
      description: From a browser session only. The token is in this response and never again.
      tags: [me]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "201":
          description: The new token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewToken"
        default:
          $ref: "#/components/responses/Error"
  /me/tokens/{token}:
    delete:
      operationId: revokeMyToken
      summary: Revoke one of my API tokens, at once
      tags: [me]
      parameters:
        - name: token
          in: path
          required: true
          description: The token's ID, from its prefix.
          schema:
            type: string
      responses:
        "204":
          description: Revoked.
        default:
          $ref: "#/components/responses/Error"
  /admin/members:
    get:
      operationId: listMembers
      summary: Every member
      tags: [admin]
      responses:
        "200":
          description: Every member, including disabled ones.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Members"
        default:
          $ref: "#/components/responses/Error"
  /admin/members/{id}:
    patch:
      operationId: updateMember
      summary: Change a member's name or permissions, or disable them
      description: >-
        Disabling a member ends their sessions and revokes their tokens. Members are never deleted. Park keeps at
        least one active admin.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberPatch"
      responses:
        "200":
          description: The member, changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        default:
          $ref: "#/components/responses/Error"
  /admin/members/{id}/identities:
    post:
      operationId: linkMemberIdentity
      summary: Link a forge account to a member by hand
      description: The account is named by its numeric ID on the forge, never by a login. The link records who made it.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkRequest"
      responses:
        "201":
          description: The link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        default:
          $ref: "#/components/responses/Error"
  /admin/invites:
    get:
      operationId: listInvites
      summary: Every invite
      tags: [admin]
      responses:
        "200":
          description: Every invite, without its code.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invites"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createInvite
      summary: Create an invite
      description: The code is in this response and never again.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteRequest"
      responses:
        "201":
          description: The new invite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewInvite"
        default:
          $ref: "#/components/responses/Error"
  /admin/invites/{id}:
    delete:
      operationId: deleteInvite
      summary: Withdraw an unused invite
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Withdrawn.
        default:
          $ref: "#/components/responses/Error"
  /admin/forges:
    get:
      operationId: listForges
      summary: Every forge
      tags: [admin]
      responses:
        "200":
          description: Every forge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forges"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createForge
      summary: Add a forge
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgeRequest"
      responses:
        "201":
          description: The new forge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forge"
        default:
          $ref: "#/components/responses/Error"
  /admin/forges/{id}:
    patch:
      operationId: updateForge
      summary: Rename a forge, or move it to a new base address
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgePatch"
      responses:
        "200":
          description: The forge, changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forge"
        default:
          $ref: "#/components/responses/Error"
  /admin/providers:
    get:
      operationId: listProviders
      summary: Every sign-in provider
      tags: [admin]
      responses:
        "200":
          description: Every sign-in provider, without its client secret.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Providers"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createProvider
      summary: Add a sign-in provider
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderRequest"
      responses:
        "201":
          description: The new provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        default:
          $ref: "#/components/responses/Error"
  /admin/providers/{provider}:
    patch:
      operationId: updateProvider
      summary: Change a sign-in provider's name or client
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/ProviderID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderPatch"
      responses:
        "200":
          description: The provider, changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: deleteProvider
      summary: Remove a sign-in provider
      description: Linked forge accounts belong to their forge, and stay.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/ProviderID"
      responses:
        "204":
          description: Removed.
        default:
          $ref: "#/components/responses/Error"
  /prs:
    get:
      operationId: listPullRequests
      summary: Pull requests Park collects
      tags: [prs]
      parameters:
        - name: repo
          in: query
          description: Only this repository's.
          schema:
            type: integer
            format: int64
        - name: state
          in: query
          schema:
            type: string
            enum: [open, all]
            default: open
      responses:
        "200":
          description: The pull requests, by repository and number.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullRequests"
        default:
          $ref: "#/components/responses/Error"
  /prs/{id}:
    get:
      operationId: getPullRequest
      summary: A pull request's facts
      tags: [prs]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The pull request, with every fact Park holds about it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullRequest"
        default:
          $ref: "#/components/responses/Error"
  /prs/{id}/timeline:
    get:
      operationId: getPullRequestTimeline
      summary: A pull request's fact events
      tags: [prs]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Its fact events, in sequence order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeline"
        default:
          $ref: "#/components/responses/Error"
  /prs/{id}/refresh:
    post:
      operationId: refreshPullRequest
      summary: Refresh a pull request from its forge now
      tags: [prs]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "202":
          description: The refresh is queued.
        default:
          $ref: "#/components/responses/Error"
  /admin/installations:
    get:
      operationId: listInstallations
      summary: Every installation
      tags: [admin]
      responses:
        "200":
          description: Every installation, without its secrets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Installations"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createInstallation
      summary: Connect to a forge
      description: >-
        With a token, or an app installation. The credential and the webhook secret are sealed with the server's
        secret key, and never shown again. Deliveries for it go to `/hooks/{id}`.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallationRequest"
      responses:
        "201":
          description: The new installation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Installation"
        default:
          $ref: "#/components/responses/Error"
  /admin/installations/{id}:
    patch:
      operationId: updateInstallation
      summary: Rename an installation, or replace its credential or webhook secret
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallationPatch"
      responses:
        "200":
          description: The installation, changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Installation"
        default:
          $ref: "#/components/responses/Error"
  /admin/repos:
    get:
      operationId: listRepos
      summary: Every repository Park knows
      tags: [admin]
      responses:
        "200":
          description: Every repository, watched or not.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repos"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: watchRepo
      summary: Watch a repository, through an installation
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoRequest"
      responses:
        "201":
          description: The repository, watched; polling starts at once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repo"
        default:
          $ref: "#/components/responses/Error"
  /admin/repos/{id}:
    patch:
      operationId: updateRepo
      summary: Start or stop watching a repository
      description: Its facts stay either way.
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepoPatch"
      responses:
        "200":
          description: The repository, changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repo"
        default:
          $ref: "#/components/responses/Error"
  /groups:
    get:
      operationId: listGroups
      summary: The active groups, with their pull requests
      tags: [groups]
      responses:
        "200":
          description: The active groups, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Groups"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createGroup
      summary: Make a group of pull requests
      tags: [groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupRequest"
      responses:
        "201":
          description: The new group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        default:
          $ref: "#/components/responses/Error"
  /groups/{id}:
    get:
      operationId: getGroup
      summary: A group; a merged group's ID leads to the group it joined
      tags: [groups]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        default:
          $ref: "#/components/responses/Error"
    patch:
      operationId: renameGroup
      summary: Rename a group
      tags: [groups]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupPatch"
      responses:
        "200":
          description: The group, renamed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        default:
          $ref: "#/components/responses/Error"
  /groups/{id}/members:
    post:
      operationId: moveIntoGroup
      summary: Move a pull request into a group
      tags: [groups]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRequest"
      responses:
        "200":
          description: The group, with the pull request in it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        default:
          $ref: "#/components/responses/Error"
  /groups/{id}/members/{pr}:
    delete:
      operationId: takeOutOfGroup
      summary: Take a pull request out of a group
      description: The exclusion holds against every source; the pull request falls back to its next-best claim, or stands alone.
      tags: [groups]
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: pr
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Taken out.
        default:
          $ref: "#/components/responses/Error"
  /groups/{id}/merge:
    post:
      operationId: mergeGroups
      summary: Merge another group into this one
      tags: [groups]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeRequest"
      responses:
        "200":
          description: The group, with the other's pull requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        default:
          $ref: "#/components/responses/Error"
  /groups/{id}/split:
    post:
      operationId: splitGroup
      summary: Split pull requests out of a group into a new one
      tags: [groups]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupRequest"
      responses:
        "201":
          description: The new group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        default:
          $ref: "#/components/responses/Error"
  /suggestions:
    get:
      operationId: listSuggestions
      summary: Open grouping suggestions
      tags: [groups]
      responses:
        "200":
          description: The open suggestions, oldest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Suggestions"
        default:
          $ref: "#/components/responses/Error"
  /suggestions/{id}/accept:
    post:
      operationId: acceptSuggestion
      summary: Accept a suggestion, placing its pull request in its group
      tags: [groups]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Accepted.
        default:
          $ref: "#/components/responses/Error"
  /suggestions/{id}/dismiss:
    post:
      operationId: dismissSuggestion
      summary: Dismiss a suggestion; it does not open again
      tags: [groups]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "204":
          description: Dismissed.
        default:
          $ref: "#/components/responses/Error"
  /assertions:
    post:
      operationId: postAssertion
      summary: Assert, as a bridge, that pull requests belong together
      description: >-
        With a bridge's token. The bridge, not the request, is the source. Reposting under an anchor replaces the
        assertion there. A repository that is not watched is refused like an unknown one.
      tags: [groups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssertionRequest"
      responses:
        "201":
          description: Recorded; applied unless it names more pull requests than the largest applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssertionResult"
        default:
          $ref: "#/components/responses/Error"
    delete:
      operationId: retractAssertion
      summary: Retract, as a bridge, the live assertion under an anchor
      tags: [groups]
      parameters:
        - name: anchor
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Retracted.
        default:
          $ref: "#/components/responses/Error"
  /admin/bridges:
    get:
      operationId: listBridges
      summary: Every registered bridge
      tags: [admin]
      responses:
        "200":
          description: The bridges.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bridges"
        default:
          $ref: "#/components/responses/Error"
    post:
      operationId: createBridge
      summary: Register a bridge
      description: Its owner then creates its token, with bridge_id, at POST /me/tokens.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BridgeRequest"
      responses:
        "201":
          description: The bridge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bridge"
        default:
          $ref: "#/components/responses/Error"
  /fields:
    get:
      operationId: listFields
      summary: The field catalog, every field a condition or a reason can read
      tags: [rules]
      responses:
        "200":
          description: The fields, judgements last.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fields"
        default:
          $ref: "#/components/responses/Error"
  /questions:
    get:
      operationId: listQuestions
      summary: The questions judgements answer
      tags: [rules]
      responses:
        "200":
          description: The questions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Questions"
        default:
          $ref: "#/components/responses/Error"
  /rulesets:
    get:
      operationId: listRuleSets
      summary: The published rule set versions, newest first; the first is in force
      tags: [rules]
      responses:
        "200":
          description: The versions, without their rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleSetVersions"
        default:
          $ref: "#/components/responses/Error"
  /rulesets/{version}:
    get:
      operationId: getRuleSet
      summary: A published rule set version
      tags: [rules]
      parameters:
        - name: version
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The version, with its rules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleSetVersion"
        default:
          $ref: "#/components/responses/Error"
  /rulesets/drafts:
    post:
      operationId: createRuleSetDraft
      summary: Start a draft of the next version, from the published one or from an imported rule-set file
      description: >-
        Needs the rules permission. A draft with problems is saved, and lists them; it cannot be published until it has
        none.
      tags: [rules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftRequest"
      responses:
        "201":
          description: The draft, with its problems.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleSetDraft"
        default:
          $ref: "#/components/responses/Error"
  /rulesets/drafts/{id}:
    put:
      operationId: updateRuleSetDraft
      summary: Replace a draft's rules, and with base_version, bring it up to date
      tags: [rules]
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftUpdate"
      responses:
        "200":
          description: The draft, with its problems.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleSetDraft"
        default:
          $ref: "#/components/responses/Error"
  /rulesets/drafts/{id}/publish:
    post:
      operationId: publishRuleSetDraft
      summary: Publish a draft as the next version
      description: >-
        Refused with stale_draft when another version was published since the draft's base, and with
        draft_has_problems while it has any.
      tags: [rules]
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "201":
          description: The new version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleSetVersion"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: park_session
      description: A browser session. Requests that change state also carry the X-CSRF-Token header.
    token:
      type: http
      scheme: bearer
      description: An API token, park_<id>_<secret>.
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ProviderID:
      name: provider
      in: path
      required: true
      description: The stable ID an admin gave the sign-in provider.
      schema:
        type: string
  schemas:
    SetupStatus:
      type: object
      required: [needed]
      properties:
        needed:
          type: boolean
    SetupRequest:
      type: object
      required: [code, username, password, display_name]
      properties:
        code:
          type: string
        username:
          type: string
        password:
          type: string
        display_name:
          type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    RegisterRequest:
      type: object
      required: [invite, username, password, display_name]
      properties:
        invite:
          type: string
        username:
          type: string
        password:
          type: string
        display_name:
          type: string
    AuthProviders:
      type: object
      required: [local, providers]
      properties:
        local:
          type: boolean
          description: Whether local accounts can sign in.
        providers:
          type: array
          items:
            $ref: "#/components/schemas/AuthProvider"
    AuthProvider:
      type: object
      required: [id, kind, name]
      properties:
        id:
          type: string
          description: The stable ID an admin gave the provider, the `{provider}` in `/auth/{provider}/start`.
        kind:
          type: string
          enum: [forge, oidc]
        name:
          type: string
          description: What the sign-in page calls it.
    Member:
      type: object
      required: [id, display_name, admin, rules, disabled, created_at]
      properties:
        id:
          type: integer
          format: int64
        display_name:
          type: string
        admin:
          type: boolean
        rules:
          type: boolean
          description: May draft and publish rule sets.
        disabled:
          type: boolean
        created_at:
          type: string
          format: date-time
    Members:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/Member"
    Me:
      type: object
      required: [member]
      properties:
        member:
          $ref: "#/components/schemas/Member"
        csrf_token:
          type: string
          description: For a browser session, the value of the X-CSRF-Token header.
        scopes:
          type: array
          description: For an API token, its scopes.
          items:
            type: string
    MemberPatch:
      type: object
      properties:
        display_name:
          type: string
        admin:
          type: boolean
        rules:
          type: boolean
        disabled:
          type: boolean
    Identity:
      type: object
      required: [id, forge_id, forge_name, account_id, login, name, linked_at]
      properties:
        id:
          type: integer
          format: int64
        forge_id:
          type: integer
          format: int64
        forge_name:
          type: string
        account_id:
          type: integer
          format: int64
          description: The account's stable ID on the forge.
        login:
          type: string
          description: Display only; it can change.
        name:
          type: string
        linked_by:
          type: integer
          format: int64
          nullable: true
          description: The admin who linked it by hand; null when it was verified through the forge.
        linked_at:
          type: string
          format: date-time
    Identities:
      type: object
      required: [identities]
      properties:
        identities:
          type: array
          items:
            $ref: "#/components/schemas/Identity"
    LinkRequest:
      type: object
      required: [forge_id, account_id]
      properties:
        forge_id:
          type: integer
          format: int64
        account_id:
          type: integer
          format: int64
    Token:
      type: object
      required: [id, name, scopes, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        revoked_at:
          type: string
          format: date-time
          nullable: true
        bridge_id:
          type: integer
          format: int64
          nullable: true
    Tokens:
      type: object
      required: [tokens]
      properties:
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/Token"
    TokenRequest:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum: [read, "tasks:work", "assertions:write"]
        expires_at:
          type: string
          format: date-time
        bridge_id:
          type: integer
          format: int64
          description: For a bridge the member owns; its token has the one scope assertions:write.
    NewToken:
      type: object
      required: [token, record]
      properties:
        token:
          type: string
          description: Shown this once.
        record:
          $ref: "#/components/schemas/Token"
    Invite:
      type: object
      required: [id, created_by, created_at, expires_at]
      properties:
        id:
          type: integer
          format: int64
        created_by:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        used_by:
          type: integer
          format: int64
          nullable: true
        used_at:
          type: string
          format: date-time
          nullable: true
    Invites:
      type: object
      required: [invites]
      properties:
        invites:
          type: array
          items:
            $ref: "#/components/schemas/Invite"
    InviteRequest:
      type: object
      properties:
        expires_in_hours:
          type: integer
          description: 168, a week, by default; at most 720.
    NewInvite:
      type: object
      required: [code, invite]
      properties:
        code:
          type: string
          description: Shown this once.
        invite:
          $ref: "#/components/schemas/Invite"
    Forge:
      type: object
